[project]
name = "week2-dukaan-box"
version = "0.1.0"
description = "Shop Rate Bot — Side Hustle shop FAQ (Gemma via Ollama + stub)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

# Optional: `ollama run gemma4:e2b` (or $GEMMA_MODEL; falls back to gemma3n:e2b)
# for the real local-model brain. App boots and serves the deterministic
# stub without it.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
